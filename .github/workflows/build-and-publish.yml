name: Build complete Ask Pastor John feed

on:
  workflow_dispatch:
  schedule:
    # Verifică zilnic RSS-ul oficial pentru episoade noi.
    - cron: "30 13 * * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build complete RSS feed
        env:
          PUBLIC_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ask-pastor-john-complete.rss
        run: |
          mkdir -p public

          python build_feed.py \
            --catalog catalog.json \
            --output public/ask-pastor-john-complete.rss \
            --public-url "$PUBLIC_FEED_URL"

      - name: Create landing page
        env:
          PUBLIC_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ask-pastor-john-complete.rss
        run: |
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          url = os.environ["PUBLIC_FEED_URL"]

          Path("public/index.html").write_text(
              f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Ask Pastor John — Complete Archive</title>
          </head>
          <body>
            <h1>Ask Pastor John — Complete Archive</h1>
            <p>Complete RSS archive of Ask Pastor John.</p>
            <p><a href="{html.escape(url)}">Open RSS feed</a></p>
          </body>
          </html>
          """,
              encoding="utf-8",
          )
          PY

      - name: Save updated episode catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Ask Pastor John episode catalog"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
